[project]
name = "pipelines"
version = "1.0.0"
description = "Training, evaluation and MLflow experiment-tracking pipelines."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common-lib",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "numpy>=2.1",
    "mlflow>=2.18",
    "skops>=0.11",
    "joblib>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines"]
