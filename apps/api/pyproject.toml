[project]
name = "api"
version = "1.0.0"
description = "Low-latency model serving API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common-lib",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-fastapi-instrumentator>=7.0",
    "orjson>=3.10",
    "scikit-learn>=1.6",
    "skops>=0.11",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
