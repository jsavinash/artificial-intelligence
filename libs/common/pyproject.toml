[project]
name = "common-lib"
version = "1.0.0"
description = "Shared schemas, logging and configuration for the ML platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "dynaconf>=3.2",
    "python-json-logger>=3.2",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_lib"]
