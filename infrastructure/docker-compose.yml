services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    image: ml-platform/api:1.0.0
    environment:
      # export.py promotes artifacts/latest -> <run-id>; mount is read-only.
      MODEL_ARTIFACT_PATH: /models/latest/pipeline.skops
    volumes:
      - ../artifacts:/models:ro
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.5
    command: >
      server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --artifacts-destination /mlartifacts
      --serve-artifacts
    volumes:
      - mlflow-data:/mlruns
      - mlflow-artifacts:/mlartifacts
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mlflow-data:
  mlflow-artifacts:
  prometheus-data:
